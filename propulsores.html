<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propulsores - Halcon Space</title>
    <link rel="shortcut icon" href="https://halconspace.site/img/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="css/propulsores.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="js/main.js"></script> <!-- Cargar el menú superior y pie de pagina-->
    

    <!-- EMBED DE LA PAGINA -->
     <!-- Open Graph (Facebook, WhatsApp, LinkedIn, etc.) -->
<meta property="og:title" content="Propulsores - Halcon Space">
<meta property="og:description" content="Halcon Space es líder en exploración espacial y comunicación satelital desde Kerbin. Misiones, lanzamientos y vehículos.">
<meta property="og:url" content="https://halconspace.site/propulsores">
<meta property="og:image" content="https://halconspace.site/img/misiones/Eyes%20above%20the%20Horizon%201/Aterrizaje.png">
<meta property="og:image:alt" content="Propulsores - Halcon Space">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_ES">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Propulsores - Halcon Space">
<meta name="twitter:description" content="Halcon Space es líder en exploración espacial y comunicación satelital desde Kerbin. Misiones, lanzamientos y vehículos.">
<meta name="twitter:image" content="https://halconspace.site/img/misiones/NROL-12/Landing.jpg">
<meta name="twitter:image:alt" content="Halcon Space">
<meta name="twitter:site" content="@HalconSpace">
</head>
<body>
    <div id="menu-container"></div>
    <div style="height: 50px;"></div>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <div class="header-content">
                    <h1 class="header-title">Propulsores</h1>
                    <p class="header-subtitle">Flota de primera etapa reutilizable de Halcon Space</p>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="total-boosters">0</div>
                        <div class="stat-label">Propulsores</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="total-flights">0</div>
                        <div class="stat-label">Vuelos Totales</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="active-boosters">0</div>
                        <div class="stat-label">Activos</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">Todos</button>
                <button class="filter-btn" data-filter="activo">Activos</button>
                <button class="filter-btn" data-filter="retirado">Retirados</button>
                <button class="filter-btn" data-filter="destruido">Destruidos</button>
            </div>
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Buscar propulsor..." class="search-box">
            </div>
        </div>

        <div class="boosters-grid" id="boosters-grid">
            <div class="loading">Cargando propulsores...</div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="booster-modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-body" id="modal-body"></div>
        </div>
    </div>
    <script type="module" src="js/propulsores.js"></script> <!-- Cargar propulsores -->
    
</body>
</html>
